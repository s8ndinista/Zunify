[package]
name = "spotify-ferro"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ferroui-base = { path = "vendor/FerroUI/src/FerroUI.Base" }
ferroui-controls = { path = "vendor/FerroUI/src/FerroUI.Controls" }
ferroui-controls-repeater = { path = "vendor/FerroUI/src/FerroUI.Controls.Repeater" }
ferroui-themes-winui = { path = "vendor/FerroUI/src/FerroUI.Themes.WinUI" }
ferroui-fonts-inter = { path = "vendor/FerroUI/src/FerroUI.Fonts.Inter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "emscripten")'.dependencies]
ferroui-browser = { path = "vendor/FerroUI/src/Browser/FerroUI.Browser" }
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ferroui-desktop = { path = "vendor/FerroUI/src/FerroUI.Desktop" }
base64 = "0.22"
getrandom = "0.4"
open = "5"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "3.5", features = ["json"] }
url = "2"

[profile.dev]
debug = 0

[profile.browser]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
